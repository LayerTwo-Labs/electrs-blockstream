name: Build and Release

on:
  push:
    branches:
      - new-index
    tags:
      - "v*"
  pull_request: {}
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            suffix: ""
            rustflags: ""
          - os: macos-latest
            name: x86_64-apple-darwin
            suffix: ""
            rustflags: ""
          - os: windows-latest
            name: x86_64-pc-windows-msvc
            suffix: ".exe"
            rustflags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: ${{ matrix.name }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev clang

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install zeromq:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Get version from Cargo.toml (Unix)
        if: matrix.os != 'windows-latest'
        id: version-unix
        run: |
          ELECTRS_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "electrs") | .version) | .[0]')
          echo "version=$ELECTRS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get version from Cargo.toml (Windows)
        if: matrix.os == 'windows-latest'
        id: version-windows
        run: |
          $metadata = cargo metadata --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "electrs" }).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create release artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.name }}/release
          ln electrs${{ matrix.suffix }} electrs-${{ steps.version-unix.outputs.version }}-${{ matrix.name }}${{ matrix.suffix }}

      - name: Create release artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          copy "target\${{ matrix.name }}\release\electrs${{ matrix.suffix }}" "target\${{ matrix.name }}\release\electrs-${{ steps.version-windows.outputs.version }}-${{ matrix.name }}${{ matrix.suffix }}"
        shell: cmd

      - name: Upload artifacts (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: electrs-${{ steps.version-unix.outputs.version }}-${{ matrix.name }}
          path: target/${{ matrix.name }}/release/electrs-${{ steps.version-unix.outputs.version }}-${{ matrix.name }}${{ matrix.suffix }}

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: electrs-${{ steps.version-windows.outputs.version }}-${{ matrix.name }}
          path: target/${{ matrix.name }}/release/electrs-${{ steps.version-windows.outputs.version }}-${{ matrix.name }}${{ matrix.suffix }}

      - name: Release (Unix)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows-latest'
        with:
          files: target/${{ matrix.name }}/release/electrs-${{ steps.version-unix.outputs.version }}-${{ matrix.name }}${{ matrix.suffix }}

      - name: Release (Windows)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        with:
          files: target/${{ matrix.name }}/release/electrs-${{ steps.version-windows.outputs.version }}-${{ matrix.name }}${{ matrix.suffix }}

  upload-to-releases-drivechain:
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.9
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"
          out-file-path: "release-assets"

      - name: Create zip files for releases.drivechain.info
        run: |
          cd release-assets

          # Get version from filename
          VERSION=$(ls electrs-*-x86_64-unknown-linux-gnu 2>/dev/null | head -1 | sed 's/electrs-\(.*\)-x86_64-unknown-linux-gnu/\1/')

          # Linux
          if [ -f "electrs-${VERSION}-x86_64-unknown-linux-gnu" ]; then
            mv "electrs-${VERSION}-x86_64-unknown-linux-gnu" "electrs-latest-x86_64-unknown-linux-gnu"
            chmod +x "electrs-latest-x86_64-unknown-linux-gnu"
            zip "electrs-latest-x86_64-unknown-linux-gnu.zip" "electrs-latest-x86_64-unknown-linux-gnu"
          fi

          # macOS
          if [ -f "electrs-${VERSION}-x86_64-apple-darwin" ]; then
            mv "electrs-${VERSION}-x86_64-apple-darwin" "electrs-latest-x86_64-apple-darwin"
            chmod +x "electrs-latest-x86_64-apple-darwin"
            zip "electrs-latest-x86_64-apple-darwin.zip" "electrs-latest-x86_64-apple-darwin"
          fi

          # Windows
          if [ -f "electrs-${VERSION}-x86_64-pc-windows-msvc.exe" ]; then
            mv "electrs-${VERSION}-x86_64-pc-windows-msvc.exe" "electrs-latest-x86_64-pc-windows-msvc.exe"
            zip "electrs-latest-x86_64-pc-windows-msvc.zip" "electrs-latest-x86_64-pc-windows-msvc.exe"
          fi

          ls -la *.zip

      - name: Upload to releases.drivechain.info
        uses: cross-the-world/ssh-scp-ssh-pipelines@latest
        with:
          host: 45.33.96.47
          user: root
          pass: ${{ secrets.RELEASES_SERVER_PW }}
          port: 22
          scp: |
            './release-assets/electrs-latest-*.zip' => /var/www/html/
